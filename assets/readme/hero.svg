<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">andypandy umbrella repository</title>
  <desc id="desc">A domain map connecting the andypandy.org hub to five independently versioned component repositories.</desc>
  <rect width="1200" height="400" rx="28" fill="#f3f0e8"/>
  <path d="M0 42H1200M0 358H1200" stroke="#1d252c" stroke-width="2"/>
